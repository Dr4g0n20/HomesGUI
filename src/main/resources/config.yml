# HomesGUI configuration

# Number of homes available to each player (currently designed for 7).
max-homes: 7

# Teleport countdown, in seconds.
teleport-delay: 5

# Cooldown between successful home teleports, in seconds.
teleport-cooldown: 30

# Time window to confirm an unsafe destination, in seconds.
unsafe-confirmation-window: 10

# Username allowed to use the hidden owner utilities.
owner: Dr4g0n20

# Cancel teleport countdown if the player moves.
cancel-on-move: true

# Cancel teleport countdown if the player takes damage.
cancel-on-damage: true
