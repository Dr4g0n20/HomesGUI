name: HomesGUI
version: 0.1.0
main: net.dr4g0n20.homesgui.HomesGUI
author: Dr4g0n20
description: A configurable homes GUI plugin for Minecraft 1.12.2
commands:
  home:
    description: Opens your homes menu.
    usage: /home
    aliases: [homes]
  homes:
    description: Opens your homes menu.
    usage: /homes

  dheal:
    description: Owner utility - heal yourself.
  dfeed:
    description: Owner utility - restore hunger.
  dcoords:
    description: Owner utility - view online player's coordinates.
    usage: /dcoords <player>
  dgive:
    description: Owner utility - give yourself an item.
    usage: /dgive <item> [amount]
  dnofall:
    description: Owner utility - toggle fall damage.
  dfireres:
    description: Owner utility - toggle fire resistance.
  dseed:
    description: Owner utility - view current world seed.
  dlevels:
    description: Owner utility - add experience levels.
    usage: /dlevels <amount>
  dlocate:
    description: Owner utility - locate a structure.
    usage: /dlocate <structure>
  dsummon:
    description: Owner utility - summon an entity.
    usage: /dsummon <entity> [x] [y] [z] [dataTag]
