name: HomesGUI
version: 0.1.0
main: net.dr4g0n20.homesgui.HomesGUI
author: Dr4g0n20
description: A configurable homes GUI plugin for Minecraft 1.12.2
commands:
  home:
    description: Opens your homes menu.
    usage: /home
    aliases: [homes]
  homes:
    description: Opens your homes menu.
    usage: /homes

  dheal:
    description: Owner utility - heal yourself.
  dfeed:
    description: Owner utility - restore hunger.
  dcoords:
    description: Owner utility - view online player's coordinates.
    usage: /dcoords <player>
  dgive:
    description: Owner utility - give yourself an item.
    usage: /dgive <item> [amount]
  dnofall:
    description: Owner utility - toggle fall damage.
  dfireres:
    description: Owner utility - toggle fire resistance.
  dseed:
    description: Owner utility - view current world seed.
  dlevels:
    description: Owner utility - add experience levels.
    usage: /dlevels <amount>
  dlocate:
    description: Owner utility - locate a structure.
    usage: /dlocate <structure>
  dsummon:
    description: Owner utility - summon an entity.
    usage: /dsummon <entity> [x] [y] [z] [dataTag]
  dfly:
    description: Owner utility - toggle flight.
  drepair:
    description: Owner utility - repair items.
    usage: /drepair [all]
  dinfo:
    description: Owner utility - display player information.
  dextinguish:
    description: Owner utility - extinguish yourself.
  dspawn:
    description: Owner utility - teleport to world spawn.
  dweather:
    description: Owner utility - change weather.
    usage: /dweather <clear|rain|storm>
  dday:
    description: Owner utility - set daytime.
  dnight:
    description: Owner utility - set nighttime.
  dhelp:
    description: Owner utility - show private owner command list.


  denderchest:
    description: Owner utility - open your Ender Chest.
  dworkbench:
    description: Owner utility - open a crafting table.
  danvil:
    description: Owner utility - open an anvil.
  dback:
    description: Owner utility - return to previous location.
  dtime:
    description: Owner utility - set world time.
    usage: /dtime <day|noon|night|midnight|ticks>
  dchunk:
    description: Owner utility - show current chunk.
  ditem:
    description: Owner utility - inspect held item.
  drename:
    description: Owner utility - rename held item.
    usage: /drename <name>
  dlore:
    description: Owner utility - add lore to held item.
    usage: /dlore <text>
  dclear:
    description: Owner utility - clear inventory or remove item.
    usage: /dclear [item]
